name: Unstable Image

# Builds the rolling image on every code push. On master it is tagged
# ':unstable'; on other branches it is tagged after the branch. The unstable
# image enables the self-updater (installing yt-dlp from git) so it tracks the
# newest yt-dlp while running.

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'SECURITY-REVIEW.md'
      - 'CLAUDE.md'
      - 'release-versions/**'
      - 'tests/**'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  unstable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute image tag
        id: meta
        run: |
          set -euo pipefail
          ref='${{ github.ref_name }}'
          if [ "$ref" = 'master' ]; then
            tag='unstable'
          else
            # Sanitize the branch name into a valid, lowercase image tag.
            tag="$(printf '%s' "$ref" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_.-' '-' | cut -c1-120)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ytdlp_version=$(cat release-versions/latest.txt 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Configure rolling self-updater (git) for master
        if: github.ref_name == 'master'
        run: |
          set -euo pipefail
          # Install yt-dlp from git in the updater, and ensure git is present.
          sed -i -E \
            's![^ ]*pip .*install .*yt-dlp\[default\].*!pip --no-cache-dir --quiet install --upgrade --force-reinstall --no-deps git+https://github.com/yt-dlp/yt-dlp.git!' \
            root/app/youtube-dl/updater.sh
          sed -i -E 's!(python3-pip)!\1 \\\n        git!' Dockerfile
          grep -q 'git+https://github.com/yt-dlp/yt-dlp.git' root/app/youtube-dl/updater.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            YTDLP_VERSION=${{ steps.meta.outputs.ytdlp_version }}
            AUTOUPDATE=true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
