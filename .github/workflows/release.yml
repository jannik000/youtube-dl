name: Release Images

# Checks for a new yt-dlp release twice a day. Images are built when the
# version changed, when the pinned image for the current version is missing
# from GHCR (e.g. after a failed build, or before the first release), or on a
# manual run. Before anything is published, the validator tests and the
# end-to-end container tests run against exactly that yt-dlp version.
#
# The new yt-dlp code only ever runs in the read-only 'verify' job (no stored
# credentials). The 'publish' job has write access but never executes yt-dlp
# on the runner; it records the version only after the images were pushed.

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    # Releases are only ever built from master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Determine latest yt-dlp release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | jq -r '.tag_name')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "Unexpected yt-dlp version string: '$version'" >&2
            exit 1
          fi
          current="$(cat release-versions/latest.txt 2>/dev/null || true)"
          changed=false
          [ "$version" != "$current" ] && changed=true
          exists=false
          if docker buildx imagetools inspect "$IMAGE:v$version" >/dev/null 2>&1; then
            exists=true
          fi
          build=false
          if [ "$changed" = true ] || [ "$exists" = false ] \
             || [ '${{ github.event_name }}' = workflow_dispatch ]; then
            build=true
          fi
          {
            echo "version=$version"
            echo "changed=$changed"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "yt-dlp: latest=$version recorded='$current' changed=$changed image_exists=$exists build=$build"

      - name: Set up Python
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Test the validator against the new yt-dlp
        if: steps.check.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r root/app/requirements.txt "yt-dlp[default]==${{ steps.check.outputs.version }}"
          pip install pytest httpx
          pytest -q root/app/youtube-dl-webui/tests

      - name: End-to-end test the image with the new yt-dlp
        if: steps.check.outputs.build == 'true'
        env:
          E2E_BUILD_ARGS: --build-arg YTDLP_VERSION=${{ steps.check.outputs.version }} --build-arg AUTOUPDATE=false
        run: bash tests/e2e/run.sh

  publish:
    needs: verify
    if: needs.verify.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      # Outputs of the untrusted verify job: re-validated below, passed to
      # scripts only through the environment.
      VERSION: ${{ needs.verify.outputs.version }}
      CHANGED: ${{ needs.verify.outputs.changed }}
    steps:
      - name: Re-validate inputs from verify
        run: |
          set -euo pipefail
          printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
          case "$CHANGED" in true|false) ;; *) exit 1 ;; esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          # Never run a binfmt image restored from the shared Actions cache
          # (writable by other jobs) with --privileged in this job.
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            YTDLP_VERSION=${{ env.VERSION }}
            AUTOUPDATE=false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ env.VERSION }}

      # Recorded only after the push succeeded; if anything before failed, the
      # missing image makes the next scheduled run build again. master may
      # have moved since the run started, so commit on top of its current
      # head (and skip if another run already recorded the version).
      - name: Record new release version
        if: env.CHANGED == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --depth=1 origin master
            git checkout -q -B master origin/master
            if [ "$(cat release-versions/latest.txt 2>/dev/null)" = "$VERSION" ]; then
              echo "v$VERSION is already recorded on master."
              exit 0
            fi
            printf '%s\n' "$VERSION" > release-versions/latest.txt
            git commit -qam "Release: v$VERSION"
            if git push origin master; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), retrying"
            sleep 5
          done
          exit 1
