name: Release Images

# Checks for a new yt-dlp release and, when found, records the version and
# builds the pinned ':latest' and ':v<version>' images to GHCR. Everything
# runs with the built-in GITHUB_TOKEN; no Docker Hub or personal tokens.

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Determine latest yt-dlp release
        id: check
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | jq -r '.tag_name')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "Unexpected yt-dlp version string: '$version'" >&2
            exit 1
          fi
          current="$(cat release-versions/latest.txt 2>/dev/null || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "yt-dlp $version is already current; nothing to build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New yt-dlp version: $version (was '$current')."
          fi

      - name: Record new release version
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.check.outputs.version }}" > release-versions/latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release: v${{ steps.check.outputs.version }}"
          git push

      - name: Set up QEMU
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned images
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            YTDLP_VERSION=${{ steps.check.outputs.version }}
            AUTOUPDATE=false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ steps.check.outputs.version }}
