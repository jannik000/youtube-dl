name: Release Images

# Checks for a new yt-dlp release. When one is found (or on a manual run), the
# validator tests and the end-to-end container tests run against exactly that
# yt-dlp version first; only if they pass is the version recorded and are the
# pinned ':latest' and ':v<version>' images pushed to GHCR. Everything runs
# with the built-in GITHUB_TOKEN; no Docker Hub or personal tokens.

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Determine latest yt-dlp release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | jq -r '.tag_name')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "Unexpected yt-dlp version string: '$version'" >&2
            exit 1
          fi
          current="$(cat release-versions/latest.txt 2>/dev/null || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          changed=false
          [ "$version" != "$current" ] && changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # A manual run always builds, e.g. to publish the first images.
          build="$changed"
          [ '${{ github.event_name }}' = workflow_dispatch ] && build=true
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "yt-dlp: latest=$version recorded='$current' changed=$changed build=$build"

      - name: Set up Python
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Test the validator against the new yt-dlp
        if: steps.check.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r root/app/requirements.txt "yt-dlp[default]==${{ steps.check.outputs.version }}"
          pip install pytest httpx
          pytest -q root/app/youtube-dl-webui/tests

      - name: End-to-end test the image with the new yt-dlp
        if: steps.check.outputs.build == 'true'
        env:
          E2E_BUILD_ARGS: --build-arg YTDLP_VERSION=${{ steps.check.outputs.version }} --build-arg AUTOUPDATE=false
        run: bash tests/e2e/run.sh

      - name: Record new release version
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.check.outputs.version }}" > release-versions/latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release: v${{ steps.check.outputs.version }}"
          git push

      - name: Set up QEMU
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: steps.check.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned images
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            YTDLP_VERSION=${{ steps.check.outputs.version }}
            AUTOUPDATE=false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ steps.check.outputs.version }}
