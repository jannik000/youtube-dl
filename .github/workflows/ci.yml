name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r root/app/requirements.txt 'yt-dlp[default]'
          pip install pytest httpx pip-audit

      - name: Run tests
        run: pytest -q root/app/youtube-dl-webui/tests

      - name: Audit pinned dependencies for known CVEs
        run: pip-audit -r root/app/requirements.txt --strict

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning \
            root/entrypoint.sh \
            root/app/youtube-dl/*.sh \
            root/etc/cont-init.d/* \
            root/etc/supervisor/terminate.sh
