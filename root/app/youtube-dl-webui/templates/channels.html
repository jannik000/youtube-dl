{% extends "layout.html" %}

{% block content %}
<div class="ui container">
    <form method="post" action="{{ base_path }}/edit/channels/save">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <h2 class="ui header">Channels.txt</h2>
        {% if readonly %}
        <div class="ui warning message">Configuration editing is disabled (WEBUI_READONLY). This file is read-only.</div>
        {% endif %}
        <div class="ui form">
            <div class="field">
                <textarea name="channels_new" rows="30"{% if readonly %} readonly{% endif %}
                    style="width:100%;font-family:Courier New, monospace;white-space: pre-line">{% for line in channels %}{{ line }}{% endfor %}</textarea>
            </div>
            <div class="field">
                <input type="submit" value="Save" class="ui primary button"{% if readonly %} disabled{% endif %} />
            </div>
        </div>
    </form>
</div>
{% endblock %}
