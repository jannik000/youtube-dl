[program:youtube-dl-webui]
command=/opt/venv/bin/uvicorn --app-dir /app/youtube-dl-webui youtube-dl-webui:webserver --host 0.0.0.0 --port %(ENV_youtubedl_webuiport)s --timeout-graceful-shutdown 3
user=abc
environment=PATH="/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME="/home/abc"
umask=%(ENV_UMASK)s
autostart=true
autorestart=true
; One worker (the download queue and the dashboard live in its memory). On
; stop, uvicorn waits at most 3 s for open requests, then its shutdown stops
; running manual downloads (SIGTERM, SIGKILL 2 s later) and marks them
; interrupted; give it the time before supervisor's SIGKILL.
stopwaitsecs=15
stdout_logfile=/var/log/youtube-dl-webui/youtube-dl-webui.log
stderr_logfile=/var/log/youtube-dl-webui/youtube-dl-webui.log
stdout_logfile_maxbytes=512KB
stderr_logfile_maxbytes=512KB
