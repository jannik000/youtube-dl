[program:youtube-dl]
command=/bin/bash -c "/app/youtube-dl/youtube-dl.sh 2>&1 | tee /var/log/youtube-dl/youtube-dl.log"
user=abc
environment=PATH="/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME="/home/abc"
umask=%(ENV_UMASK)s
autostart=true
autorestart=true
; Send stop signals to the whole process group (bash -c, youtube-dl.sh,
; yt-dlp, ffmpeg, tee). Signalling only 'bash -c' left the old pass running
; after a restart, next to the new one. The SIGKILL to the group follows only
; if 'bash -c' still runs after stopwaitsecs, so a member that ignores
; SIGTERM (a user script with trap '' TERM) can survive.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
